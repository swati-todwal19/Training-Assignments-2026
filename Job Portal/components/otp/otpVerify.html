<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Verification</title>
  <link rel="stylesheet" href="./otpVerify.css">
</head>
<body>
  <div class="auth-container">
    <h2>OTP Verification</h2>
    <p>Please enter the 6-digit OTP sent to your email</p>

    <form id="otpForm">
      <input type="text" id="otpInput" placeholder="Enter OTP" maxlength="6" required />
      <button type="submit" class="btn primary">Verify OTP</button>
    </form>

    <p>OTP expires in <span id="otpTimer">05:00</span></p>

    <p>Didn't receive OTP? <span id="resendOtp">Resend OTP</span></p>
  </div>

  <script type="module" src="./otpVerify.js"></script>
</body>
</html>
